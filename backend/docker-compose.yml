services:
  mysql:
    build: ./mysql
    container_name: pagoflex-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: pagoflex
      MYSQL_PASSWORD: pagoflex
      TZ: America/Santiago
    ports:
      - "3306:3306"
    volumes:
      - datos-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  ms-movimientos:
    build: ./ms-movimientos
    container_name: pagoflex-ms-movimientos
    ports:
      - "8084:8084"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: pagoflex
      DB_PASSWORD: pagoflex
      TZ: America/Santiago
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure

  ms-usuarios:
    build: ./ms-usuarios
    container_name: pagoflex-ms-usuarios
    ports:
      - "8081:8081"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: pagoflex
      DB_PASSWORD: pagoflex
      TZ: America/Santiago
      MS_MOVIMIENTOS_URL: http://ms-movimientos:8084
    depends_on:
      mysql:
        condition: service_healthy
      ms-movimientos:
        condition: service_started
    restart: on-failure

  ms-compromisos:
    build: ./ms-compromisos
    container_name: pagoflex-ms-compromisos
    ports:
      - "8082:8082"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: pagoflex
      DB_PASSWORD: pagoflex
      TZ: America/Santiago
      MS_MOVIMIENTOS_URL: http://ms-movimientos:8084
      MS_USUARIOS_URL: http://ms-usuarios:8081
    depends_on:
      mysql:
        condition: service_healthy
      ms-movimientos:
        condition: service_started
      ms-usuarios:
        condition: service_started
    restart: on-failure

  ms-pagos:
    build: ./ms-pagos
    container_name: pagoflex-ms-pagos
    ports:
      - "8083:8083"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: pagoflex
      DB_PASSWORD: pagoflex
      TZ: America/Santiago
      MS_MOVIMIENTOS_URL: http://ms-movimientos:8084
      MS_USUARIOS_URL: http://ms-usuarios:8081
      MS_COMPROMISOS_URL: http://ms-compromisos:8082
    depends_on:
      mysql:
        condition: service_healthy
      ms-movimientos:
        condition: service_started
      ms-usuarios:
        condition: service_started
      ms-compromisos:
        condition: service_started
    restart: on-failure

volumes:
  datos-mysql:
