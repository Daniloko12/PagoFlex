spring.application.name=ms-pagos
server.port=8083

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/pagoflex_pagos?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&connectionTimeZone=America/Santiago
spring.datasource.username=${DB_USER:pagoflex}
spring.datasource.password=${DB_PASSWORD:pagoflex}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.time-zone=America/Santiago

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

servicios.movimientos.url=${MS_MOVIMIENTOS_URL:http://localhost:8084}
servicios.usuarios.url=${MS_USUARIOS_URL:http://localhost:8081}
servicios.compromisos.url=${MS_COMPROMISOS_URL:http://localhost:8082}
