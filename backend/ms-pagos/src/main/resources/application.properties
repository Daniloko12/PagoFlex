spring.application.name=ms-pagos
server.port=8083

spring.datasource.url=jdbc:h2:file:~/pagoflex-datos/pagos
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.time-zone=America/Santiago

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

servicios.movimientos.url=${MS_MOVIMIENTOS_URL:http://localhost:8084}
servicios.usuarios.url=${MS_USUARIOS_URL:http://localhost:8081}
servicios.compromisos.url=${MS_COMPROMISOS_URL:http://localhost:8082}
